<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" width="960" height="290" role="img" aria-labelledby="t d"><title id="t">A1 safe commit offsets</title><desc id="d">Eight offsets; 0, 1, 2, 4 and 5 are processed and 3, 6 and 7 are held. The safe commit is offset 3, the naive one is 8.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#59636e"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0969da"/></marker></defs><rect x="0.5" y="0.5" width="959" height="289" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="40" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328" text-anchor="start">A1. Commit what is safe, not what was fetched</text><rect x="70" y="130" width="84" height="56" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/><text x="112.0" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">offset 0</text><text x="112.0" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a7f37" text-anchor="middle">processed</text><rect x="170" y="130" width="84" height="56" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/><text x="212.0" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">offset 1</text><text x="212.0" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a7f37" text-anchor="middle">processed</text><rect x="270" y="130" width="84" height="56" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/><text x="312.0" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">offset 2</text><text x="312.0" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a7f37" text-anchor="middle">processed</text><rect x="370" y="130" width="84" height="56" rx="8" fill="#ffffff" stroke="#9a6700" stroke-width="2"/><text x="412.0" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">offset 3</text><text x="412.0" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9a6700" text-anchor="middle">held</text><rect x="470" y="130" width="84" height="56" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/><text x="512.0" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">offset 4</text><text x="512.0" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a7f37" text-anchor="middle">processed</text><rect x="570" y="130" width="84" height="56" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/><text x="612.0" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">offset 5</text><text x="612.0" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a7f37" text-anchor="middle">processed</text><rect x="670" y="130" width="84" height="56" rx="8" fill="#ffffff" stroke="#9a6700" stroke-width="2"/><text x="712.0" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">offset 6</text><text x="712.0" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9a6700" text-anchor="middle">held</text><rect x="770" y="130" width="84" height="56" rx="8" fill="#ffffff" stroke="#9a6700" stroke-width="2"/><text x="812.0" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">offset 7</text><text x="812.0" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9a6700" text-anchor="middle">held</text><line x1="362" y1="88" x2="362" y2="126" stroke="#0969da" stroke-width="2" marker-end="url(#ac)"/><text x="362" y="76" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0969da" text-anchor="middle">safe commit = 3</text><text x="362" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">(replay starts here)</text><line x1="854" y1="88" x2="854" y2="126" stroke="#cf222e" stroke-width="2" marker-end="url(#ah)"/><text x="854" y="76" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#cf222e" text-anchor="middle">naive commit = 8</text><text x="70" y="232" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">Tracker commits the lowest offset not yet Done. A crash replays 3 to 7; nothing held is lost.</text><text x="70" y="254" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">Committing the last fetched offset would skip the held events 3, 6 and 7 for good.</text></svg>
