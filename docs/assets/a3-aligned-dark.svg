<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" width="960" height="310" role="img" aria-labelledby="t d"><title id="t">A3 aligned watermark</title><desc id="d">Three sources: p0 is far ahead, p1 is slowest, p2 is idle. The aligned watermark sits at p1.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker></defs><rect x="0.5" y="0.5" width="959" height="309" rx="12" fill="#0d1117" stroke="#30363d"/><text x="40" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="start">A3. One watermark over several sources</text><text x="50" y="115" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">p0</text><line x1="100" y1="110" x2="900" y2="110" stroke="#30363d" stroke-width="3"/><circle cx="800" cy="110" r="9" fill="#3fb950"/><text x="816" y="115" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3fb950" text-anchor="start">watermark</text><text x="50" y="165" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">p1</text><line x1="100" y1="160" x2="900" y2="160" stroke="#30363d" stroke-width="3"/><circle cx="560" cy="160" r="9" fill="#d29922"/><text x="576" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#d29922" text-anchor="start">slowest active source</text><text x="50" y="215" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">p2</text><line x1="100" y1="210" x2="900" y2="210" stroke="#30363d" stroke-width="3" stroke-dasharray="2 6"/><circle cx="250" cy="210" r="9" fill="#8b949e" opacity="0.55"/><text x="266" y="215" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">idle, excluded</text><line x1="560" y1="84" x2="560" y2="236" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ac)"/><text x="560" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#58a6ff" text-anchor="middle">aligned watermark = minimum of the active sources</text><text x="100" y="270" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">Release by the fastest source and p1's events become late. Aligned holds at p1, skips p2 while it is quiet,</text><text x="100" y="290" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">and Lag names the source holding it back.</text></svg>
