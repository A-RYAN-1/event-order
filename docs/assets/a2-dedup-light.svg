<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="960" height="270" role="img" aria-labelledby="t d"><title id="t">A2 duplicate window</title><desc id="d">A repeated id inside the window is dropped; a repeat after the window has passed is not caught.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#59636e"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0969da"/></marker></defs><rect x="0.5" y="0.5" width="959" height="269" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="40" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328" text-anchor="start">A2. Drop repeats inside a bounded window</text><line x1="50" y1="170" x2="920" y2="170" stroke="#59636e" stroke-width="1.5" marker-end="url(#ah)"/><text x="920" y="196" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="end">event time</text><rect x="120" y="92" width="440" height="34" rx="17" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="340" y="114" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0969da" text-anchor="middle">window: ids remembered (bounded by time and by count)</text><rect x="96" y="138" width="48" height="44" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/><text x="120" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#1a7f37" text-anchor="middle">A</text><rect x="196" y="138" width="48" height="44" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/><text x="220" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#1a7f37" text-anchor="middle">B</text><rect x="296" y="138" width="48" height="44" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/><text x="320" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#1a7f37" text-anchor="middle">C</text><rect x="416" y="138" width="48" height="44" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="2" stroke-dasharray="5 4"/><text x="440" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#cf222e" text-anchor="middle">A</text><rect x="676" y="138" width="48" height="44" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="2" stroke-dasharray="5 4"/><text x="700" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#59636e" text-anchor="middle">A</text><text x="440" y="214" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#cf222e" text-anchor="middle">repeat inside the window</text><text x="440" y="230" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">dropped, never reaches the buffer</text><text x="700" y="214" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#59636e" text-anchor="middle">repeat after the window</text><text x="700" y="230" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">not caught: keep processing idempotent</text></svg>
