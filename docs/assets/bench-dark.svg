<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" width="960" height="230" role="img" aria-labelledby="t d"><title id="t">Cost per event against sort-every-add</title><desc id="d">Buffer.Add costs 131 ns per event; sorting the buffer on every add costs 1493 ns, at a disorder window of 256.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker></defs><rect x="0.5" y="0.5" width="959" height="229" rx="12" fill="#0d1117" stroke="#30363d"/><text x="40" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="start">Cost per event at a disorder window of 256 (ns, lower is better)</text><text x="40" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">Buffer.Add (0 allocations)</text><rect x="300" y="78" width="41" height="32" rx="6" fill="#58a6ff"/><text x="353" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">131 ns</text><text x="40" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">sort on every add (3 allocations)</text><rect x="300" y="130" width="470" height="32" rx="6" fill="#8b949e"/><text x="782" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">1,493 ns</text><text x="40" y="200" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">Median of 10 runs, Windows amd64, Go 1.27.0, i5-13450HX, 2026-10-24. Reproduce with scripts/bench.sh.</text></svg>
