<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="t d"><title id="t">How the pieces fit</title><desc id="d">Sources go through Dedup, a keyed Buffer, your code and a Tracker to a broker commit; Aligned feeds the buffer.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker></defs><rect x="0.5" y="0.5" width="959" height="319" rx="12" fill="#0d1117" stroke="#30363d"/><text x="40" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="start">How the pieces fit</text><rect x="40" y="110" width="100" height="64" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="90.0" y="138" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">Sources</text><text x="90.0" y="158" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle">Kafka, MQTT, files</text><rect x="176" y="110" width="120" height="64" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="236.0" y="138" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">Dedup</text><text x="236.0" y="158" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle">bounded window</text><rect x="262" y="99" width="34" height="20" rx="10" fill="#d29922"/><text x="279" y="114" font-family="syst