name: Bug report
description: Events came out in the wrong order, were lost, or something panicked
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Smallest program that shows it
      description: Include the options you pass to New and the event times in arrival order.
      render: go
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and Go version
    validations:
      required: true
