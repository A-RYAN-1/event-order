name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.23", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go build ./...
      - run: go test -race -count=1 -cover ./...
      - run: go test -run xxx -fuzz FuzzBuffer -fuzztime 15s
      - run: go test -run xxx -bench . -benchtime 1000x
