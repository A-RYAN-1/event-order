name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.23", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go build ./...
      - run: go test -race -count=1 -cover ./...
      - run: go test -run xxx -fuzz FuzzBuffer -fuzztime 15s
      - run: go test -run xxx -fuzz FuzzKeyed -fuzztime 15s
      - run: go test -run xxx -fuzz FuzzMerge -fuzztime 15s
      - run: go test -run xxx -bench . -benchtime 1000x
      - name: example modules
        run: |
          for d in examples/kafka examples/mqtt examples/watermill; do
            (cd "$d" && go vet ./... && go test -race -count=1 ./...)
          done
      - run: go test -run xxx -fuzz FuzzTracker -fuzztime 15s
      - run: go test -run xxx -fuzz FuzzDedup -fuzztime 15s
      - run: go test -run xxx -fuzz FuzzAligned -fuzztime 15s
      - run: go test -run xxx -fuzz FuzzStream -fuzztime 15s
  portable:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go build ./...
      - run: go test -count=1 ./...
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [".", examples/kafka, examples/mqtt, examples/watermill]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: ${{ matrix.dir }}
          args: --config=${{ github.workspace }}/.golangci.yml
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: start brokers
        run: |
          docker run -d --name kafka -p 9092:9092 apache/kafka:3.9.0
          docker run -d --name mosquitto -p 1883:1883 eclipse-mosquitto:2 mosquitto -c /mosquitto-no-auth.conf
          timeout 60 sh -c 'until nc -z localhost 9092 && nc -z localhost 1883; do sleep 1; done'
          sleep 10
      - name: kafka (restart from committed offsets, rebalance)
        working-directory: examples/kafka
        env:
          KAFKA_BROKERS: localhost:9092
        run: go test -tags integration -count=1 -v -run Integration .
      - name: mqtt (several publishers)
        working-directory: examples/mqtt
        env:
          MQTT_BROKER: tcp://localhost:1883
        run: go test -tags integration -count=1 -v -run Integration .
      - name: broker logs on failure
        if: failure()
        run: docker logs kafka | tail -50; docker logs mosquitto | tail -20
