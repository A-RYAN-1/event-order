name: dco
# Every commit in a pull request carries a Signed-off-by line (git commit -s),
# the Developer Certificate of Origin. No copyright is assigned.
on:
  pull_request:
permissions:
  contents: read
jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: check sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format=%an "$c")
            case "$author" in *"[bot]"*) continue ;; esac
            if ! git log -1 --format=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+>$'; then
              echo "missing Signed-off-by: $(git log -1 --format='%h %s' "$c")"
              bad=1
            fi
          done
          if [ "$bad" = 1 ]; then
            echo "Fix with: git rebase --signoff origin/main && git push --force-with-lease"
            exit 1
          fi
