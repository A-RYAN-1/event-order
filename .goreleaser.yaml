version: 2
project_name: event-order
builds:
  - id: event-order
    main: ./cmd/event-order
    binary: event-order
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "event-order_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, CHANGELOG.md]
checksum:
  name_template: checksums.txt
# Release notes come from CHANGELOG.md (see release.yml), the single source.
changelog:
  disable: true
release:
  draft: false
  prerelease: auto
